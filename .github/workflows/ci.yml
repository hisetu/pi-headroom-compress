name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 26]
        headroom-version: ["0.27.0", "0.36.5", "0.37.0", "0.38.0", "0.40.0"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Node dependencies
        run: npm ci

      - name: Install reference Headroom with code extras (${{ matrix.headroom-version }})
        run: uv tool install "headroom-ai[code]==${{ matrix.headroom-version }}"

      - name: Verify Headroom code extras
        run: |
          "$HOME/.local/share/uv/tools/headroom-ai/bin/python" - <<'PY'
          import tree_sitter
          from headroom.transforms.code_compressor import CodeAwareCompressor
          assert tree_sitter and CodeAwareCompressor
          PY

      - name: Unit tests
        run: npm test

      - name: Compression benchmark
        run: npm run benchmark
        env:
          HEADROOM_REFERENCE: headroom-ai[code]==${{ matrix.headroom-version }}

      - name: Golden parity regression gate
        run: npm run parity
        env:
          HEADROOM_REFERENCE: headroom-ai[code]==${{ matrix.headroom-version }}
